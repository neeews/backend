spring.application.name=neeews

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.access-expiration=1800000
jwt.refresh-expiration=604800000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.port=9080

app.base-url=${BASE_URL:http://localhost:9080}
app.image.storage-path=./images/articles
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://neeews.site,http://localhost:3000,http://localhost:5173}

app.rss.fetch-interval-ms=${RSS_FETCH_INTERVAL_MS:600000}

app.summary.enabled=${SUMMARY_ENABLED:true}
app.summary.ollama-url=${OLLAMA_URL:http://127.0.0.1:11434}
app.summary.model=${OLLAMA_MODEL:exaone3.5:2.4b}
app.summary.batch-size=${SUMMARY_BATCH_SIZE:20}
app.summary.max-input-length=1000
app.summary.min-score=${SUMMARY_MIN_SCORE:0.93}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

app.importance.enabled=${IMPORTANCE_ENABLED:true}
app.importance.max-per-run=${IMPORTANCE_MAX_PER_RUN:400}
app.importance.muni-url=${MUNI_URL:http://127.0.0.1:8000}
app.importance.batch-size=32
app.importance.threshold=${IMPORTANCE_THRESHOLD:0.5}

app.huggingface.watched-orgs=${HF_WATCHED_ORGS:Qwen,deepseek-ai,meta-llama,mistralai,google,openai,nvidia,microsoft,moonshotai,zai-org,MiniMaxAI,LGAI-EXAONE,naver-hyperclovax,upstage}
app.huggingface.release-min-likes=${HF_RELEASE_MIN_LIKES:100}

app.devstack.repositories=${DEVSTACK_REPOSITORIES:spring-projects/spring-boot,spring-projects/spring-framework,spring-projects/spring-security,hibernate/hibernate-orm,gradle/gradle,jhy/jsoup}
app.devstack.maven-packages=${DEVSTACK_MAVEN_PACKAGES:org.springframework.boot:spring-boot,org.springframework:spring-web,org.springframework:spring-webmvc,org.springframework.security:spring-security-core,org.springframework.security:spring-security-web,org.hibernate.orm:hibernate-core,com.mysql:mysql-connector-j,tools.jackson.core:jackson-databind,com.fasterxml.jackson.core:jackson-databind,org.apache.tomcat.embed:tomcat-embed-core,io.jsonwebtoken:jjwt-impl,org.jsoup:jsoup,com.rometools:rome}
app.devstack.github-token=${GITHUB_TOKEN:}

app.briefing.enabled=${BRIEFING_ENABLED:false}
app.briefing.site-url=${BRIEFING_SITE_URL:https://neeews.site}
app.briefing.api-url=${BRIEFING_API_URL:https://neeews.site/api}
app.briefing.mail.username=${BRIEFING_MAIL_USERNAME:}
app.briefing.mail.password=${BRIEFING_MAIL_PASSWORD:}

