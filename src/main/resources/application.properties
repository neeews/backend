spring.application.name=neeews

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.access-expiration=1800000
jwt.refresh-expiration=604800000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.port=9080

app.base-url=${BASE_URL:http://localhost:9080}
app.image.storage-path=./images/articles
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://neeews.site,http://localhost:3000,http://localhost:5173}

app.summary.enabled=${SUMMARY_ENABLED:true}
app.summary.ollama-url=${OLLAMA_URL:http://127.0.0.1:11434}
app.summary.model=${OLLAMA_MODEL:exaone3.5:2.4b}
app.summary.batch-size=5
app.summary.max-input-length=1000
